# pnpm 9 — which Vercel still selects — treats this file as a workspace
# declaration and fails the install with "packages field missing or empty"
# unless this key is present.
packages:
  - .

minimumReleaseAgeExclude:
  - "@next/env@16.3.1"
  - "@next/swc-darwin-arm64@16.3.1"
  - "@next/swc-darwin-x64@16.3.1"
  - "@next/swc-linux-arm64-gnu@16.3.1"
  - "@next/swc-linux-arm64-musl@16.3.1"
  - "@next/swc-linux-x64-gnu@16.3.1"
  - "@next/swc-linux-x64-musl@16.3.1"
  - "@next/swc-win32-arm64-msvc@16.3.1"
  - "@next/swc-win32-x64-msvc@16.3.1"
  - next@16.3.1
  # Unpinned, unlike the entries above: the release-age guard exists to put
  # distance between a stranger's publish and this install, and linkfolio is
  # our own package. Pinning it meant editing this file on every release
  # before the bump could resolve.
  - linkfolio
